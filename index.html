<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6c3fff" />
  <meta name="description" content="CheckMate – A beautiful mobile checklist app" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CheckMate" />
  <title>CheckMate</title>
  <!-- Handle GitHub Pages SPA redirect from 404.html -->
  <script>
    (function(){
      var redirect = sessionStorage.getItem('spa_redirect');
      if (redirect) {
        sessionStorage.removeItem('spa_redirect');
        window.history.replaceState(null, null, redirect);
      }
    })();
  </script>
  <link rel="manifest" href="https://apphosting-vh.github.io/checklistxv01/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: light;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --bg: #eef1ff;
      --surface: #ffffff;
      --surface2: #ffffff;
      --card: #ffffff;
      --card-hover: #f3f0ff;
      --done-bg: #f0f0f4;
      --accent: #6c3fff;
      --accent2: #ff5c8a;
      --accent3: #00bfa5;
      --accent4: #ff8c00;
      --text: #1a1340;
      --text-muted: #66668c;
      --border: rgba(108,63,255,0.14);
      --shadow: 0 4px 24px rgba(108,63,255,0.10);
      --radius: 18px;
      --radius-sm: 10px;
    }

    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Nunito', sans-serif; overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    }

    button, [role="button"], .color-dot, .priority-btn, .filter-pill, .task-check, .icon-btn, .tab-btn {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #root { height: 100%; display: flex; flex-direction: column; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(108,63,255,0.28); border-radius: 4px; }

    .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; }

    /* Header */
    .header {
      padding: calc(var(--sat) + 24px) 24px 18px;
      background: linear-gradient(180deg, var(--surface) 0%, rgba(238,241,255,0) 100%);
      position: relative;
      z-index: 10;
      flex-shrink: 0;
      transition: padding 0.22s ease;
    }
    .header.collapsed { padding-bottom: 10px; }
    .header.collapsed .header-subtitle { display: none; }
    .header.collapsed .logo { font-size: 24px; }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .logo { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    .header-subtitle { font-size: 14px; color: var(--text-muted); font-weight: 500; letter-spacing: 0.3px; }

    /* Content area */
    .content {
      flex: 1; overflow-y: auto; padding: 18px 24px 130px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    /* Error banner */
    .error-banner {
      margin: 0 0 14px; padding: 13px 16px; border-radius: 14px;
      background: rgba(255,23,68,0.10); border: 1px solid rgba(255,23,68,0.25);
      color: #b00020; font-weight: 700; font-size: 14px;
      display: flex; align-items: center; gap: 10px;
      animation: fadeUp 0.3s ease both;
    }
    .error-banner button {
      margin-left: auto; border: none; background: transparent; color: inherit;
      font-weight: 800; font-size: 13px; cursor: pointer; text-decoration: underline;
    }

    /* ── LISTS VIEW ── */
    .lists-grid { display: flex; flex-direction: column; gap: 14px; }
    .category-heading {
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 12px;
      letter-spacing: 0.9px; text-transform: uppercase; color: var(--text-muted);
      margin: 10px 2px 0;
    }
    .category-heading:first-child { margin-top: 0; }

    .list-card {
      background: var(--card); border-radius: var(--radius);
      padding: 20px 22px; cursor: pointer;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
      position: relative; overflow: hidden;
      animation: fadeUp 0.3s ease both;
    }
    .list-card:active { transform: scale(0.98); background: var(--card-hover); }

    .list-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .list-card-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 20px; line-height: 1.2; flex: 1; }
    .list-card-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 46px; height: 46px; border-radius: 50%; border: none;
      background: rgba(108,63,255,0.08); color: var(--text-muted);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.18s ease; font-size: 18px; flex-shrink: 0;
    }
    .icon-btn:hover { background: linear-gradient(135deg,#ede7ff,#fce4ec); color: #7c4dff; transform: scale(1.08); }
    .icon-btn.danger:hover { background: linear-gradient(135deg,#fce4ec,#fff3e0); color: #e53935; }
    .icon-btn:active { transform: scale(0.9); }
    .icon-btn:focus-visible, button:focus-visible, .color-dot:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid rgba(108,63,255,0.55); outline-offset: 2px;
    }

    .list-card-meta { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
    .progress-bar { flex: 1; height: 4px; background: rgba(108,63,255,0.12); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
    .progress-label { font-size: 12px; color: var(--text-muted); white-space: nowrap; font-weight: 600; }
    .task-count { font-size: 13px; color: var(--text-muted); margin-top: 8px; font-weight: 600; }

    /* Empty state */
    .empty-state { text-align: center; padding: 60px 20px; animation: fadeUp 0.4s ease both; }
    .empty-icon { margin-bottom: 16px; opacity: 0.6; display: flex; justify-content: center; align-items: center; }
    .empty-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 22px; margin-bottom: 8px; }
    .empty-sub { font-size: 15px; color: var(--text-muted); line-height: 1.5; font-weight: 500; white-space: pre-line; }

    /* ── TASKS VIEW ── */
    .tasks-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .back-btn {
      height: 44px; padding: 0 18px; border-radius: 50px; border: none;
      background: #1a1340; color: #ffffff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 18px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700;
      transition: all 0.18s ease; flex-shrink: 0; white-space: nowrap;
      box-shadow: 0 3px 12px rgba(26,19,64,0.22);
    }
    .back-btn:hover { background: #2d2260; }
    .back-btn:active { transform: scale(0.93); }
    .tasks-header-text { flex: 1; min-width: 0; }
    .tasks-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 25px; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tasks-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 2px; font-weight: 600; }
    .header-icon {
      width: 44px; height: 44px; border-radius: 50%; border: none; flex-shrink: 0;
      background: var(--card); color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow); transition: all 0.18s ease;
    }
    .header-icon:hover { color: var(--accent); transform: scale(1.06); }
    .header-icon:active { transform: scale(0.9); }
    .select-count {
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 18px;
      color: var(--accent); flex-shrink: 0;
    }

    .task-filters { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
    .filter-pill {
      padding: 12px 20px; border-radius: 50px; border: 1.5px solid var(--border);
      font-size: 15px; font-weight: 700; cursor: pointer; background: var(--card);
      color: var(--text-muted); transition: all 0.2s; font-family: 'Nunito', sans-serif;
      min-height: 48px; display: inline-flex; align-items: center;
    }
    .filter-pill.active { background: linear-gradient(135deg,#ede7ff,#fce4ff); border-color: #7c4dff; color: #7c4dff; }
    .filter-pill:active { transform: scale(0.95); }
    .filters-spacer { flex: 1; }
    .select-toggle {
      margin-left: auto; padding: 12px 16px; border-radius: 50px; border: none;
      background: var(--card); color: var(--accent); font-weight: 800; font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif; cursor: pointer; min-height: 48px;
      display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow);
    }
    .select-toggle:active { transform: scale(0.95); }

    /* Quick add */
    .quick-add { display: flex; gap: 8px; margin-bottom: 14px; }
    .quick-add input {
      flex: 1; min-width: 0; padding: 14px 16px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); background: var(--card); color: var(--text);
      font-family: 'Nunito', sans-serif; font-size: 16px; outline: none; transition: border-color 0.2s;
    }
    .quick-add input:focus { border-color: var(--accent); }
    .quick-add input::placeholder { color: var(--text-muted); }
    .quick-add-btn {
      width: 52px; flex-shrink: 0; border: none; border-radius: var(--radius-sm);
      background: linear-gradient(135deg,#7c4dff,#e040fb); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
      box-shadow: 0 3px 12px rgba(124,77,255,0.3);
    }
    .quick-add-btn:active { transform: scale(0.94); }
    .quick-add-detail {
      width: 52px; flex-shrink: 0; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      background: var(--card); color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .quick-add-detail:hover { color: var(--accent); border-color: var(--accent); }

    .tasks-list { display: flex; flex-direction: column; gap: 10px; }

    /* Swipe wrapper */
    .task-swipe-wrap { position: relative; border-radius: var(--radius-sm); overflow: hidden; }
    .task-swipe-bg {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-start; padding-left: 20px;
      background: linear-gradient(135deg,#00bfa5,#00d4aa); color: #fff;
    }
    .task-swipe-bg.delete {
      justify-content: flex-end; padding-left: 0; padding-right: 22px;
      background: linear-gradient(135deg,#e53935,#ff5252);
    }

    .task-item {
      display: flex; flex-direction: column;
      background: var(--card); border-radius: var(--radius-sm);
      padding: 16px 16px 16px 18px;
      border: 1px solid var(--border);
      transition: background 0.2s ease;
      position: relative; user-select: none;
    }
    .task-item-main { display: flex; align-items: center; gap: 12px; width: 100%; touch-action: pan-y; }
    .task-item.done { background: var(--done-bg); border-color: rgba(0,0,0,0.04); }
    .task-item.done .task-text { color: var(--text-muted); }
    .task-item.done .task-check.checked { background: var(--text-muted); border-color: var(--text-muted); }
    .task-item.dragging { box-shadow: 0 12px 32px rgba(108,63,255,0.35); border-color: var(--accent); z-index: 5; opacity: 0.95; }

    .task-body { flex: 1; min-width: 0; }
    .task-text { font-size: 17px; line-height: 1.45; font-weight: 600; word-break: break-word; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800;
      padding: 3px 9px; border-radius: 20px; letter-spacing: 0.2px; white-space: nowrap;
    }
    .badge-due { background: rgba(108,63,255,0.12); color: #5a3fd4; }
    .badge-due.overdue { background: rgba(255,23,68,0.14); color: #d50000; }
    .badge-pri-high { background: rgba(255,23,68,0.14); color: #d50000; }
    .badge-pri-medium { background: rgba(255,140,0,0.16); color: #a85400; }
    .badge-pri-low { background: rgba(74,158,255,0.16); color: #1f6fd0; }

    /* Photo strip on task card */
    .task-photos { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px 44px; -webkit-overflow-scrolling: touch; scrollbar-width: none; touch-action: pan-x pan-y; }
    .task-photos::-webkit-scrollbar { display: none; }
    .task-photo-thumb {
      width: 72px; height: 72px; border-radius: 10px; object-fit: cover;
      flex-shrink: 0; cursor: pointer; border: 2px solid rgba(108,63,255,0.15);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      -webkit-touch-callout: none; user-select: none; -webkit-user-drag: none;
    }
    .task-photo-thumb:active { transform: scale(0.94); }

    /* Checkbox */
    .task-check {
      width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
      border: 2.5px solid rgba(108,63,255,0.35);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; font-size: 15px; font-weight: 700;
      background: transparent; color: transparent; position: relative;
    }
    .task-check::after { content: ''; position: absolute; inset: -6px; border-radius: 14px; }
    .task-check.checked { border-color: var(--accent3); background: var(--accent3); color: #fff; }
    .task-check.select { border-radius: 50%; border-color: rgba(108,63,255,0.35); }

    /* Drag handle */
    .drag-handle {
      width: 40px; height: 40px; flex-shrink: 0; border: none; background: transparent;
      color: var(--text-muted); cursor: grab; display: flex; align-items: center; justify-content: center;
      touch-action: none; border-radius: 10px;
    }
    .drag-handle:active { cursor: grabbing; color: var(--accent); }

    /* Clear done button */
    .clear-done-btn {
      padding: 10px 15px; border-radius: 50px; border: 1.5px solid rgba(255,92,138,0.35);
      background: rgba(255,92,138,0.08); color: #c0005a; min-height: 44px;
      font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
      display: inline-flex; align-items: center;
    }
    .clear-done-btn:active { transform: scale(0.95); }

    /* All-done celebration banner */
    .all-done-banner {
      margin: 0 0 12px; padding: 12px 18px; border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #d6f5f0, #e8f5e9);
      border: 1px solid rgba(0,191,165,0.25);
      color: #007a6a; font-weight: 800; font-size: 16px;
      display: flex; align-items: center; gap: 8px;
      animation: fadeUp 0.3s ease both;
    }

    /* FAB */
    .fab {
      position: fixed; bottom: calc(28px + var(--sab)); right: 50%;
      transform: translateX(50%);
      max-width: calc(480px - 48px);
      width: calc(100% - 48px);
      background: linear-gradient(135deg, #7c4dff 0%, #e040fb 100%);
      color: white; border: none; border-radius: 50px;
      padding: 20px 32px;
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 18px;
      letter-spacing: 0.4px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 6px 28px rgba(124,77,255,0.42), 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s ease; z-index: 50;
    }
    .fab:active { transform: translateX(50%) scale(0.96); }
    .fab.hidden { transform: translateX(50%) translateY(220%); opacity: 0; pointer-events: none; }

    /* PWA install prompt */
    .install-bar {
      position: fixed; bottom: calc(96px + var(--sab)); left: 50%; transform: translateX(-50%);
      max-width: calc(480px - 32px); width: calc(100% - 32px);
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 12px 14px; display: flex; align-items: center; gap: 12px;
      z-index: 60; box-shadow: var(--shadow);
      animation: fadeUp 0.3s ease both;
    }
    .install-bar-text { flex: 1; min-width: 0; }
    .install-bar-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; }
    .install-bar-sub { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .install-bar-btn {
      padding: 9px 16px; border-radius: 50px; border: none; flex-shrink: 0;
      background: linear-gradient(135deg, #7c4dff, #e040fb); color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 13px;
      cursor: pointer; min-height: 40px;
    }
    .install-bar-btn:active { transform: scale(0.95); }
    .install-bar-x {
      width: 32px; height: 32px; border-radius: 50%; border: none; flex-shrink: 0;
      background: transparent; color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .install-bar-x:hover { background: var(--card-hover); }

    /* Snackbar / undo toast */
    .snackbar {
      position: fixed; bottom: calc(104px + var(--sab)); left: 50%; transform: translateX(-50%);
      max-width: calc(480px - 32px); width: calc(100% - 32px);
      background: #1a1340; color: #fff; border-radius: 14px;
      padding: 14px 16px; display: flex; align-items: center; gap: 12px;
      z-index: 300; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      animation: fadeUp 0.25s ease both;
    }
    .snackbar-msg { flex: 1; font-size: 14px; font-weight: 600; }
    .snackbar-undo {
      border: none; background: transparent; color: #c6a8ff; cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 14px;
      padding: 8px 10px; border-radius: 8px;
    }
    .snackbar-undo:hover { background: rgba(255,255,255,0.1); }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(26,19,64,0.5);
      backdrop-filter: blur(8px); z-index: 100;
      display: flex; align-items: center; justify-content: center;
      animation: fadeIn 0.2s ease; padding: 24px;
    }
    .modal {
      background: var(--surface2); width: 100%; max-width: 420px;
      border-radius: 24px; padding: 28px 24px;
      animation: scaleIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 1px solid var(--border);
      box-shadow: 0 24px 64px rgba(26,19,64,0.18), 0 4px 16px rgba(108,63,255,0.10);
      max-height: 90vh; overflow-y: auto;
    }
    .modal-handle { display: none; }
    .modal-handle-hit { display: none; }
    .modal-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 22px; margin-bottom: 20px; }

    /* Form elements */
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 8px; display: block; }
    .form-input {
      width: 100%; padding: 14px 16px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); background: var(--card);
      color: var(--text); font-family: 'Nunito', sans-serif; font-size: 16px;
      outline: none; transition: border-color 0.2s; -webkit-appearance: none; appearance: none;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: var(--text-muted); }
    textarea.form-input { resize: none; min-height: 80px; line-height: 1.5; }
    .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; font-weight: 600; }

    .color-picker { display: flex; gap: 10px; flex-wrap: wrap; }
    .color-dot {
      width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
      transition: all 0.2s; border: 3px solid transparent;
      display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .color-dot.selected { border-color: var(--text); transform: scale(1.1); }

    .priority-picker { display: flex; gap: 8px; }
    .priority-btn {
      flex: 1; min-height: 46px; border-radius: var(--radius-sm); cursor: pointer;
      border: 1.5px solid var(--border); background: var(--card); color: var(--text-muted);
      font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .priority-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(108,63,255,0.10); }

    /* Photo section in modal */
    .photo-section { margin-bottom: 16px; }
    .photo-add-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .photo-add-btn {
      flex: 1; padding: 12px 8px; min-height: 46px; border-radius: var(--radius-sm);
      border: 1.5px dashed rgba(108,63,255,0.30); background: rgba(108,63,255,0.04);
      color: var(--accent); font-family: 'Nunito', sans-serif; font-size: 15px;
      font-weight: 700; cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 6px; transition: all 0.2s;
    }
    .photo-add-btn:active { transform: scale(0.97); }

      const d = drag.current; if (!d) return;
      if (e.cancelable) e.preventDefault();
      const dy = Math.max(0, e.clientY - d.y);
      d.dy = dy;
      const node = nodeRef.current;
      if (node) { node.style.transition = 'none'; node.style.transform = 'translateY(' + dy + 'px)'; }
    };
    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      const d = drag.current; drag.current = null;
      const node = nodeRef.current;
      if (!d || !node) return;
      node.style.transition = 'transform 0.25s ease';
      if (d.dy > 90) { node.style.transform = 'translateY(100%)'; setTimeout(() => { try { onClose(); } catch(_){} }, 200); }
      else { node.style.transform = 'translateY(0px)'; }
    };
    const onDown = (e) => {
      if (!isMobile()) return;
      drag.current = { y: e.clientY, dy: 0 };
      window.addEventListener('pointermove', onMove, { passive: false });
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    };
    return { nodeRef, onDown };
  }

  // ── Progress Ring ──
  function Ring({ pct, color }) {
    const r = 18, circ = 2 * Math.PI * r;
    const offset = circ - (pct / 100) * circ;
    const complete = pct >= 100;
    return h('div', { className: 'ring-wrap', 'aria-hidden':'true' },
      h('svg', { width: 46, height: 46, viewBox: '0 0 46 46' },
        h('circle', { className: 'ring-bg', cx: 23, cy: 23, r }),
        h('circle', {
          className: 'ring-fill', cx: 23, cy: 23, r,
          stroke: complete ? 'var(--accent3)' : (color || '#e94560'),
          strokeDasharray: circ,
          strokeDashoffset: offset,
        })
      ),
      h('div', { className: 'ring-text' }, complete ? h(IconCheck,{size:14}) : Math.round(pct) + '%')
    );
  }

  // ── Main App ──
  function App() {
    const [data, setData] = useState(load);
    const [view, setView] = useState('lists');
    const [activeList, setActiveList] = useState(null);
    const [taskFilter, setTaskFilter] = useState('all');
    const [search, setSearch] = useState('');
    const [listSearch, setListSearch] = useState('');
    const [modal, setModal] = useState(null);
    const [lightbox, setLightbox] = useState(null);
    const [toast, setToast] = useState(null);
    const [storageError, setStorageError] = useState(false);
    const [storageDismissed, setStorageDismissed] = useState(false);
    const [kbOpen, setKbOpen] = useState(false);
    const [scrolled, setScrolled] = useState(false);
    const [installEvt, setInstallEvt] = useState(null);
    const [installDismissed, setInstallDismissed] = useState(() => {
      try { return localStorage.getItem('checkmate_a2hs_dismissed') === '1'; } catch(_) { return false; }
    });

    const contentRef = useRef(null);

    useEffect(() => { setStorageError(!save(data)); }, [data]);

    // ── Hide FAB while a field is focused (on-screen keyboard) ──
    useEffect(() => {
      const isField = (el) => !!el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
      const onIn = (e) => { if (isField(e.target)) setKbOpen(true); };
      const onOut = () => setTimeout(() => setKbOpen(isField(document.activeElement)), 0);
      document.addEventListener('focusin', onIn);
      document.addEventListener('focusout', onOut);
      return () => { document.removeEventListener('focusin', onIn); document.removeEventListener('focusout', onOut); };
    }, []);

    // ── PWA install prompt ──
    useEffect(() => {
      const onPrompt = (e) => { e.preventDefault(); setInstallEvt(e); };
      const onInstalled = () => setInstallEvt(null);
      window.addEventListener('beforeinstallprompt', onPrompt);
      window.addEventListener('appinstalled', onInstalled);
      return () => { window.removeEventListener('beforeinstallprompt', onPrompt); window.removeEventListener('appinstalled', onInstalled); };
    }, []);

    // ── Android hardware back / swipe-back ──
    const stateRef = useRef({});
    stateRef.current = { view, modal, lightbox };
    const navDepth = useRef(0);
    const ignorePop = useRef(0);
    const layerCount = (view === 'tasks' ? 1 : 0) + (modal ? 1 : 0) + (lightbox ? 1 : 0);

    useEffect(() => {
      const cur = navDepth.current;
      if (layerCount > cur) {
        for (let i = cur; i < layerCount; i++) { try { history.pushState({ cm: i + 1 }, ''); } catch(_) {} }
        navDepth.current = layerCount;
      } else if (layerCount < cur) {
        const diff = cur - layerCount;
        ignorePop.current += diff;
        navDepth.current = layerCount;
        for (let i = 0; i < diff; i++) { try { history.back(); } catch(_) {} }
      }
    }, [layerCount]);

    useEffect(() => {
      const onPop = () => {
        if (ignorePop.current > 0) { ignorePop.current--; return; }
        navDepth.current = Math.max(0, navDepth.current - 1);
        const s = stateRef.current;
        if (s.lightbox) setLightbox(null);
        else if (s.modal) setModal(null);
        else if (s.view === 'tasks') { setView('lists'); setActiveList(null); }
      };
      window.addEventListener('popstate', onPop);
      return () => window.removeEventListener('popstate', onPop);
    }, []);


    const lists = data.lists;
    const tasks = (listId) => data.tasks[listId] || [];

    const currentList = lists.find(l => l.id === activeList);
    const currentTasks = activeList ? tasks(activeList) : [];

    const totalLists = lists.length;
    const totalTasks = Object.values(data.tasks).flat().length;
    const doneTasks = Object.values(data.tasks).flat().filter(t => t.done).length;

    // Categories derived from lists
    const categories = Array.from(new Set(lists.map(l => l.category).filter(Boolean)));

    // ── Undo helper ──
    const pushToast = useCallback((message, undo) => {
      setToast({ message, undo, key: uid() });
    }, []);

    // ── List CRUD ──
    const createList = ({ title, color, category }) => {
      const id = uid();
      setData(d => ({ ...d, lists: [{ id, title, color, category: category || '', createdAt: Date.now() }, ...d.lists], tasks: { ...d.tasks, [id]: [] } }));
    };
    const updateList = (id, patch) => {
      setData(d => ({ ...d, lists: d.lists.map(l => l.id === id ? { ...l, ...patch } : l) }));
    };
    const deleteList = (id) => {
      const snapshot = data;
      setData(d => { const { [id]: _, ...rest } = d.tasks; return { ...d, lists: d.lists.filter(l => l.id !== id), tasks: rest }; });
      if (activeList === id) { setView('lists'); setActiveList(null); }
      pushToast('Checklist deleted', () => setData(snapshot));
    };
    const duplicateList = (id) => {
      const src = lists.find(l => l.id === id);
      if (!src) return;
      const newId = uid();
      const cloned = tasks(id).map(t => ({ ...t, id: uid(), done: false, doneAt: null, photos: (t.photos || []).slice() }));
      setData(d => ({
        ...d,
        lists: [{ ...src, id: newId, title: src.title + ' (copy)', createdAt: Date.now() }, ...d.lists],
        tasks: { ...d.tasks, [newId]: cloned },
      }));
      pushToast('Checklist duplicated');
    };
    const resetList = (id) => {
      const snapshot = data;
      setData(d => ({ ...d, tasks: { ...d.tasks, [id]: (d.tasks[id] || []).map(t => ({ ...t, done: false, doneAt: null })) } }));
      pushToast('Checkboxes reset', () => setData(snapshot));
    };

    // ── Task CRUD ──
    const createTask = (listId, { text, photos, priority, due }) => {
      const t = { id: uid(), text, photos: photos || [], priority: priority || 'none', due: due || null, done: false, createdAt: Date.now(), doneAt: null };
      setData(d => ({ ...d, tasks: { ...d.tasks, [listId]: [t, ...(d.tasks[listId] || [])] } }));
      return t;
    };
    const updateTask = (listId, taskId, patch) => {
      setData(d => ({ ...d, tasks: { ...d.tasks, [listId]: d.tasks[listId].map(t => t.id === taskId ? { ...t, ...patch } : t) } }));
    };
    const deleteTask = (listId, taskId) => {
      const snapshot = data;
      setData(d => ({ ...d, tasks: { ...d.tasks, [listId]: d.tasks[listId].filter(t => t.id !== taskId) } }));
      pushToast('Task deleted', () => setData(snapshot));
    };
    const toggleTask = (listId, taskId) => {
      if (navigator.vibrate) navigator.vibrate(40);
      setData(d => {
        const arr = d.tasks[listId] || [];
        const target = arr.find(t => t.id === taskId);
        if (!target) return d;
        const nowDone = !target.done;
        let updated = arr.map(t => t.id === taskId ? { ...t, done: nowDone, doneAt: nowDone ? Date.now() : null } : t);
        if (nowDone) {
          const active = updated.filter(t => !t.done);
          const done = updated.filter(t => t.done).sort((a,b) => a.doneAt - b.doneAt);
          updated = [...active, ...done];
        } else {
          const moved = updated.find(t => t.id === taskId);
          const rest = updated.filter(t => t.id !== taskId);
          updated = [moved, ...rest];
        }
        return { ...d, tasks: { ...d.tasks, [listId]: updated } };
      });
    };
    const clearDoneTasks = (listId) => {
      const snapshot = data;
      const count = (data.tasks[listId] || []).filter(t => t.done).length;
      setData(d => ({ ...d, tasks: { ...d.tasks, [listId]: d.tasks[listId].filter(t => !t.done) } }));
      pushToast(count + ' completed task' + (count !== 1 ? 's' : '') + ' cleared', () => setData(snapshot));
    };
    const reorderTasks = (listId, fromId, toId) => {
      setData(d => {
        const arr = [...(d.tasks[listId] || [])];
        const from = arr.findIndex(t => t.id === fromId);
        const to = arr.findIndex(t => t.id === toId);
        if (from < 0 || to < 0 || from === to) return d;
        const [moved] = arr.splice(from, 1);
        arr.splice(to, 0, moved);
        return { ...d, tasks: { ...d.tasks, [listId]: arr } };
      });
    };

    // ── Batch ops ──
    const batchComplete = (listId, ids) => {
      if (navigator.vibrate) navigator.vibrate(20);
      const idSet = new Set(ids);
      setData(d => {
        const arr = (d.tasks[listId] || []).map(t => idSet.has(t.id) ? { ...t, done: true, doneAt: Date.now() } : t);
        const active = arr.filter(t => !t.done);
        const done = arr.filter(t => t.done).sort((a,b) => a.doneAt - b.doneAt);
        return { ...d, tasks: { ...d.tasks, [listId]: [...active, ...done] } };
      });
      pushToast(ids.length + ' task' + (ids.length !== 1 ? 's' : '') + ' completed');
    };
    const batchDelete = (listId, ids) => {
      if (navigator.vibrate) navigator.vibrate(20);
      const snapshot = data;
      const idSet = new Set(ids);
      setData(d => ({ ...d, tasks: { ...d.tasks, [listId]: (d.tasks[listId] || []).filter(t => !idSet.has(t.id)) } }));
      pushToast(ids.length + ' task' + (ids.length !== 1 ? 's' : '') + ' deleted', () => setData(snapshot));
    };
    const batchMove = (fromId, toId, ids) => {
      if (fromId === toId) return;
      if (navigator.vibrate) navigator.vibrate(20);
      const snapshot = data;
      const idSet = new Set(ids);
      setData(d => {
        const moving = (d.tasks[fromId] || []).filter(t => idSet.has(t.id));
        const remaining = (d.tasks[fromId] || []).filter(t => !idSet.has(t.id));
        return { ...d, tasks: { ...d.tasks, [fromId]: remaining, [toId]: [...moving, ...(d.tasks[toId] || [])] } };
      });
      pushToast(ids.length + ' task' + (ids.length !== 1 ? 's' : '') + ' moved', () => setData(snapshot));
    };

    // ── Backup ──
    const exportData = () => {
      try {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'checkmate-backup-' + new Date().toISOString().slice(0,10) + '.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch(e) { pushToast('Export failed'); }
    };
    const importData = (file) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.lists) || typeof parsed.tasks !== 'object') throw new Error('bad');
          const snapshot = data;
          setData({ version: SCHEMA_VERSION, lists: parsed.lists, tasks: parsed.tasks });
          pushToast('Backup restored', () => setData(snapshot));
        } catch(err) {
          pushToast('Import failed — invalid backup file');
        }
      };
      reader.readAsText(file);
    };
    const clearAllData = () => {
      const snapshot = data;
      setData(defaultData());
      setView('lists'); setActiveList(null);
      pushToast('All data cleared', () => setData(snapshot));
    };

    // ── Filtering ──
    const filteredTasks = currentTasks.filter(t => {
      const matchFilter = taskFilter === 'all' || (taskFilter === 'active' && !t.done) || (taskFilter === 'done' && t.done);
      const matchSearch = !search || t.text.toLowerCase().includes(search.toLowerCase());
      return matchFilter && matchSearch;
    });

    const listProgress = (id) => {
      const ts = tasks(id);
      if (!ts.length) return 0;
      return (ts.filter(t => t.done).length / ts.length) * 100;
    };

    const subtitle = view === 'lists'
      ? `${totalLists} list${totalLists !== 1 ? 's' : ''} \u00b7 ${doneTasks}/${totalTasks} tasks done`
      : `${currentTasks.filter(t => t.done).length}/${currentTasks.length} completed`;

    return h('div', { className: 'app' },
      // Header
      h('div', { className: 'header' + (scrolled ? ' collapsed' : '') },
        h('div', { className: 'header-top' },
          h('div', { className: 'logo' }, 'Check', h('span', null, 'Mate')),
          h('button', {
            className: 'icon-btn', 'aria-label': 'Settings and backup', title: 'Settings & backup',
            onClick: () => setModal({ type: 'settings' })
          }, h(IconDots, { size: 20 }))
        ),
        h('div', { className: 'header-subtitle' }, subtitle)
      ),

      // Content
      h('div', {
        className: 'content', ref: contentRef,
        onScroll: (e) => setScrolled(e.currentTarget.scrollTop > 24)
      },
        storageError && !storageDismissed && h('div', { className: 'error-banner', role: 'alert' },
          h(IconX, { size: 18 }),
          'Storage is full — newer changes may not be saved. Export a backup.',
          h('button', { onClick: () => setStorageDismissed(true), 'aria-label': 'Dismiss storage warning' }, 'Dismiss')
        ),
        view === 'lists'
          ? h(ListView, {
              lists, tasks, listProgress, COLORS,
              search: listSearch, onSearch: setListSearch, categories,
              onOpen: (id) => { setActiveList(id); setView('tasks'); setTaskFilter('all'); setSearch(''); setScrolled(false); if (contentRef.current) contentRef.current.scrollTop = 0; },
              onEdit: (l) => setModal({ type: 'editList', list: l }),
              onDelete: (l) => setModal({ type: 'deleteList', list: l }),
            })
          : h(TasksView, {
              list: currentList, tasks: filteredTasks, allTasks: currentTasks,
              filter: taskFilter, search, lists,
              onBack: () => { setView('lists'); setActiveList(null); setScrolled(false); if (contentRef.current) contentRef.current.scrollTop = 0; },
              onFilterChange: setTaskFilter,
              onSearch: setSearch,
              onToggle: (tid) => toggleTask(activeList, tid),
              onEdit: (t) => setModal({ type: 'editTask', task: t }),
              onDelete: (t) => setModal({ type: 'deleteTask', task: t }),
              onSwipeDelete: (t) => deleteTask(activeList, t.id),
              onClearDone: () => clearDoneTasks(activeList),
              onPhotoView: (photos, index) => setLightbox({ photos, index }),
              onQuickAdd: (text) => createTask(activeList, { text, photos: [] }),
              onOpenDetails: (text) => setModal({ type: 'newTask', prefill: text }),
              onReorder: (from, to) => reorderTasks(activeList, from, to),
              onBatchComplete: (ids) => batchComplete(activeList, ids),
              onBatchDelete: (ids) => batchDelete(activeList, ids),
              onBatchMove: (ids, toId) => batchMove(activeList, toId, ids),
              onOpenListMenu: () => setModal({ type: 'listMenu', list: currentList }),
            })
      ),

      // FAB
      view === 'lists'
        ? h('button', { className: 'fab' + (kbOpen ? ' hidden' : ''), onClick: () => setModal({ type: 'newList' }) },
            h(IconPlus, { size: 22 }), 'New Checklist')
        : h('button', { className: 'fab' + (kbOpen ? ' hidden' : ''), onClick: () => setModal({ type: 'newTask' }) },
            h(IconPlus, { size: 22 }), 'Add Item'),

      // Install prompt
      installEvt && !installDismissed && h('div', { className: 'install-bar', role: 'dialog', 'aria-label': 'Install CheckMate' },
        h('div', { className: 'install-bar-text' },
          h('div', { className: 'install-bar-title' }, 'Install CheckMate'),
          h('div', { className: 'install-bar-sub' }, 'Add to your home screen for a full-screen app')
        ),
        h('button', { className: 'install-bar-btn', onClick: async () => {
          try { installEvt.prompt(); const r = await installEvt.userChoice; if (r && r.outcome === 'accepted') setInstallEvt(null); } catch(_) {}
        } }, 'Install'),
        h('button', { className: 'install-bar-x', 'aria-label': 'Dismiss install prompt', onClick: () => { setInstallDismissed(true); try { localStorage.setItem('checkmate_a2hs_dismissed', '1'); } catch(_) {} } }, h(IconX, { size: 16 }))
      ),

      // Snackbar
      toast && h(Snackbar, { key: toast.key, message: toast.message, onUndo: toast.undo, onClose: () => setToast(null) }),

      // Modals
      modal && h(ModalLayer, {
        modal, COLORS, PRIORITIES, lists,
        onClose: () => setModal(null),
        onCreate: (payload) => {
          if (modal.type === 'newList') createList(payload);
          else if (modal.type === 'newTask') createTask(activeList, payload);
        },
        onUpdate: (payload) => {
          if (modal.type === 'editList') updateList(modal.list.id, payload);
          else if (modal.type === 'editTask') updateTask(activeList, modal.task.id, payload);
        },
        onConfirmDelete: () => {
          if (modal.type === 'deleteList') deleteList(modal.list.id);
          else if (modal.type === 'deleteTask') deleteTask(activeList, modal.task.id);
        },
        onDuplicate: (id) => duplicateList(id),
        onReset: (id) => resetList(id),
        onBatchMove: (ids, toId) => batchMove(activeList, toId, ids),
        onExport: exportData,
        onImport: importData,
        onClearAll: clearAllData,
        onEditList: (l) => setModal({ type: 'editList', list: l }),
        onDeleteList: (l) => setModal({ type: 'deleteList', list: l }),
      }),

      // Lightbox
      lightbox && h(PhotoLightbox, {
        photos: lightbox.photos,
        startIndex: lightbox.index,
        onClose: () => setLightbox(null),
      })
    );
  }

  // ── Snackbar ──
  function Snackbar({ message, onUndo, onClose }) {
    useEffect(() => {
      const t = setTimeout(onClose, onUndo ? 6000 : 3200);
      return () => clearTimeout(t);
    }, []);
    return h('div', { className: 'snackbar', role: 'status', 'aria-live': 'polite' },
      h('span', { className: 'snackbar-msg' }, message),
      onUndo && h('button', { className: 'snackbar-undo', onClick: () => { onUndo(); onClose(); } }, 'Undo'),
      h('button', { className: 'snackbar-undo', onClick: onClose, 'aria-label': 'Dismiss' }, 'Dismiss')
    );
  }

  // ── Lists View ──
  function ListView({ lists, tasks, listProgress, COLORS, search, onSearch, categories, onOpen, onEdit, onDelete }) {
    const q = (search || '').trim().toLowerCase();
    const filtered = q
      ? lists.filter(l => l.title.toLowerCase().includes(q) || (tasks(l.id) || []).some(t => t.text.toLowerCase().includes(q)))
      : lists;

    const searchBar = lists.length > 0 && h('div', { className: 'search-wrap' },
      h('span', { className: 'search-icon' }, h(IconSearch, { size: 17 })),
      h('input', {
        type: 'text', className: 'search-input', placeholder: 'Search lists and tasks…',
        enterKeyHint: 'search', autoComplete: 'off', autoCapitalize: 'none', spellCheck: false,
        value: search || '', onChange: e => onSearch(e.target.value), 'aria-label': 'Search lists and tasks'
      }),
      (search || '') !== '' && h('button', { className: 'search-clear', 'aria-label': 'Clear search', onClick: () => onSearch('') }, h(IconX, { size: 16 }))
    );

    if (!lists.length) return h('div', null,
      searchBar,
      h('div', { className: 'empty-state' },
        h('div', { className: 'empty-icon' }, h(IconCheckSq, { size: 56 })),
        h('div', { className: 'empty-title' }, 'No checklists yet'),
        h('div', { className: 'empty-sub' }, 'Tap the + button below\nto create your first checklist')
      )
    );

    const renderCard = (list, i) => {
      const ts = tasks(list.id) || [];
      const done = ts.filter(t => t.done).length;
      const pct = listProgress(list.id);
      const color = COLORS.find(c => c.id === list.color)?.val || '#e94560';
      const complete = ts.length > 0 && done === ts.length;

      return h('div', {
        key: list.id, className: 'list-card', role: 'button', tabIndex: 0,
        style: { animationDelay: Math.min(i, 8) * 0.05 + 's' },
        'aria-label': list.title + ', ' + (ts.length === 0 ? 'no tasks' : `${done} of ${ts.length} tasks completed`),
        onClick: () => onOpen(list.id),
        onKeyDown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onOpen(list.id); } },
      },
        h('div', { style: { position:'absolute', left:0, top:0, bottom:0, width:4, background: color, borderRadius:'4px 0 0 4px' } }),
        h('div', { className: 'list-card-header' },
          h('div', { className: 'list-card-title' }, list.title),
          h('div', { style: { display:'flex', alignItems:'center', gap:8 } },
            complete ? h('span', { className: 'done-badge', title: 'All done' }, h(IconCheckCircle, { size: 30 })) : h(Ring, { pct, color }),
            h('div', { className: 'list-card-actions', onClick: e => e.stopPropagation() },
              h('button', { className: 'icon-btn', onClick: () => onEdit(list), 'aria-label': 'Edit ' + list.title, title: 'Edit' }, h(IconPencil, { size: 18 })),
              h('button', { className: 'icon-btn danger', onClick: () => onDelete(list), 'aria-label': 'Delete ' + list.title, title: 'Delete' }, h(IconTrash, { size: 18 }))
            )
          )
        ),
        h('div', { className: 'task-count' },
          ts.length === 0 ? 'No tasks yet — tap to add' : `${done} of ${ts.length} task${ts.length !== 1 ? 's' : ''} completed`)
      );
    };

    const body = [];
    if (q) {
      if (!filtered.length) {
        body.push(h('div', { className: 'empty-state', key: 'nores' },
          h('div', { className: 'empty-icon' }, h(IconSearch, { size: 48 })),
          h('div', { className: 'empty-title' }, 'No matches'),
          h('div', { className: 'empty-sub' }, 'Try a different search term')
        ));
      } else {
        body.push(h('div', { className: 'lists-grid', key: 'grid' }, ...filtered.map(renderCard)));
      }
    } else if (categories.length) {
      // Group by category, uncategorized last
      const groups = {};
      lists.forEach(l => { const c = l.category || ''; (groups[c] = groups[c] || []).push(l); });
      const order = Object.keys(groups).sort((a,b) => (a === '' ? 1 : b === '' ? -1 : a.localeCompare(b)));
      let idx = 0;
      order.forEach(cat => {

        })
      ),
      h('div', { className: 'photo-section' },
        h('label', { className: 'form-label' }, 'Photos'),
        h('div', { className: 'photo-add-row' },
          h('button', { type:'button', className: 'photo-add-btn', onClick: () => cameraRef.current.click() }, h(IconCamera, { size: 17 }), ' Camera'),
          h('button', { type:'button', className: 'photo-add-btn', onClick: () => galleryRef.current.click() }, h(IconImage, { size: 17 }), ' Gallery'),
          h('input', { ref: cameraRef, type: 'file', accept: 'image/*', capture: 'environment', style: { display:'none' }, onChange: handleFiles }),
          h('input', { ref: galleryRef, type: 'file', accept: 'image/*', multiple: true, style: { display:'none' }, onChange: handleFiles })
        ),
        photos.length > 0 && h('div', { className: 'modal-photo-strip' },
          ...photos.map((src, i) =>
            h('div', { key: i, className: 'modal-photo-wrap' },
              h('img', { src, alt: 'Attachment ' + (i + 1), className: 'modal-photo-thumb' }),
              h('button', { type:'button', className: 'modal-photo-remove', 'aria-label': 'Remove photo', onClick: () => removePhoto(i) }, '\u00d7')
            )
          )
        )
      ),
      h('div', { className: 'modal-actions' },
        h('button', { className: 'btn-cancel', onClick: onClose }, 'Cancel'),
        h('button', { className: 'btn-confirm', onClick: handleSubmit, disabled: !text.trim() }, existing ? 'Save' : 'Add Task')
      )
    );
  }

  function ListMenuModal({ list, onClose, onDuplicate, onReset, onEdit, onDelete }) {
    return h(ModalShell, { onClose, label: 'Checklist options' },
      h('div', { className: 'modal-title' }, list.title),
      h('div', { className: 'menu-list' },
        h('button', { className: 'menu-item', onClick: () => { onClose(); onEdit(); } }, h(IconPencil, { size: 18 }), h('div', null, 'Edit details', h('div', { className: 'menu-item-sub' }, 'Title, category and color'))),
        h('button', { className: 'menu-item', onClick: () => { onDuplicate(list.id); onClose(); } }, h(IconCopy, { size: 18 }), h('div', null, 'Duplicate', h('div', { className: 'menu-item-sub' }, 'Copy this checklist'))),
        h('button', { className: 'menu-item', onClick: () => { onReset(list.id); onClose(); } }, h(IconRefresh, { size: 18 }), h('div', null, 'Reset checkboxes', h('div', { className: 'menu-item-sub' }, 'Uncheck every task'))),
        h('button', { className: 'menu-item danger', onClick: () => { onClose(); onDelete(); } }, h(IconTrash, { size: 18 }), h('div', null, 'Delete checklist'))
      ),
      h('div', { className: 'modal-actions' },
        h('button', { className: 'btn-cancel', onClick: onClose }, 'Close')
      )
    );
  }

  function SettingsModal({ onClose, onExport, onImport, onClearAll }) {
    const fileRef = useRef();
    return h(ModalShell, { onClose, label: 'Settings and backup' },
      h('div', { className: 'modal-title' }, 'Settings & Backup'),
      h('div', { className: 'menu-list' },
        h('button', { className: 'menu-item', onClick: onExport }, h(IconDown, { size: 18 }), h('div', null, 'Export backup', h('div', { className: 'menu-item-sub' }, 'Download all data as JSON'))),
        h('button', { className: 'menu-item', onClick: () => fileRef.current.click() }, h(IconUp, { size: 18 }), h('div', null, 'Import backup', h('div', { className: 'menu-item-sub' }, 'Restore from a JSON file'))),
        h('button', { className: 'menu-item danger', onClick: () => { if (confirm('Delete ALL checklists and tasks? This can be undone once.')) { onClearAll(); onClose(); } } }, h(IconTrash, { size: 18 }), h('div', null, 'Clear all data'))
      ),
      h('input', {
        ref: fileRef, type: 'file', accept: 'application/json', style: { display:'none' },
        onChange: e => { const f = e.target.files && e.target.files[0]; if (f) { onImport(f); onClose(); } }
      }),
      h('div', { className: 'form-hint' }, 'Your data is stored privately on this device. Export regularly to keep a backup.'),
      h('div', { className: 'modal-actions' },
        h('button', { className: 'btn-cancel', onClick: onClose }, 'Close')
      )
    );
  }

  // ── Photo Lightbox ──
  function PhotoLightbox({ photos, startIndex, onClose }) {
    const [idx, setIdx] = useState(startIndex);
    const prev = () => setIdx(i => (i - 1 + photos.length) % photos.length);
    const next = () => setIdx(i => (i + 1) % photos.length);

    useEffect(() => {
      const handler = (e) => {
        if (e.key === 'Escape') onClose();
        if (e.key === 'ArrowLeft') prev();
        if (e.key === 'ArrowRight') next();
      };
      window.addEventListener('keydown', handler);
      return () => window.removeEventListener('keydown', handler);
    }, []);

    return h('div', { className: 'lightbox', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Photo viewer', onClick: onClose },
      h('img', { src: photos[idx], alt: 'Photo ' + (idx + 1) + ' of ' + photos.length, onClick: e => e.stopPropagation() }),
      h('button', { className: 'lightbox-close', onClick: onClose, 'aria-label': 'Close' }, h(IconX, { size: 20 })),
      photos.length > 1 && h('button', { className: 'lightbox-nav prev', onClick: (e) => { e.stopPropagation(); prev(); }, 'aria-label': 'Previous photo' }, h(IconChevL, { size: 22 })),
      photos.length > 1 && h('button', { className: 'lightbox-nav next', onClick: (e) => { e.stopPropagation(); next(); }, 'aria-label': 'Next photo' }, h(IconChevR, { size: 22 })),
      photos.length > 1 && h('div', { style: { position:'absolute', bottom:24, left:'50%', transform:'translateX(-50%)', color:'rgba(255,255,255,0.75)', fontSize:13, fontWeight:600 } }, `${idx + 1} / ${photos.length}`)
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));

  // ── Service Worker registration + auto-update flow ──
  let pendingWorker = null;

  function showToast() { document.getElementById('update-toast').classList.add('show'); }
  function dismissToast() { document.getElementById('update-toast').classList.remove('show'); }
  function applyUpdate() {
    dismissToast();
    if (pendingWorker) {
      pendingWorker.postMessage({ type: 'SKIP_WAITING' });
    } else {
      window.location.reload();
    }
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('https://apphosting-vh.github.io/checklistxv01/sw.js', { updateViaCache: 'none' })
        .then(reg => {
          console.log('[CheckMate] SW registered:', reg.scope);
          if (reg.waiting) { pendingWorker = reg.waiting; showToast(); }
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                pendingWorker = newWorker;
                showToast();
              }
            });
          });
          setInterval(() => reg.update(), 60 * 1000);
        })
        .catch(err => console.warn('[CheckMate] SW registration failed:', err));

      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) { refreshing = true; window.location.reload(); }
      });

      navigator.serviceWorker.addEventListener('message', e => {
        if (e.data && e.data.type === 'SW_UPDATED') console.log('[CheckMate] App updated to', e.data.version);
      });
    });
  }
  </script>
</body>
</html>
